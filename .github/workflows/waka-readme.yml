# WakaTime coding stats – updates the README with weekly language stats
name: Waka Readme

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"   # daily at midnight UTC

jobs:
  update-readme:
    name: WakaReadme DevMetrics
    runs-on: ubuntu-latest
    steps:
      - uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          SECTION_NAME: waka
          SHOW_TITLE: true
          TIME_RANGE: last_7_days
          LANG_COUNT: 5
          SHOW_TIME: true
          SHOW_TOTAL: true
          TARGET_BRANCH: main
