# Snake animation from contribution graph – runs on schedule and updates assets
name: Update snake

on:
  push:
    branches: [main]
    paths: ['.github/workflows/snake.yml']
  schedule:
    - cron: "0 0 * * *"   # daily at midnight UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure assets dir exists
        run: mkdir -p assets

      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: smitvalture
          outputs: |
            assets/github-contribution-grid-snake.svg
            assets/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add assets/
          git diff --staged --quiet || git commit -m "chore: update contribution snake"
          git push
